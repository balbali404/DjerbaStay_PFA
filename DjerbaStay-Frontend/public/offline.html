<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DjerbaStay Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 20% 20%, #dbeafe, #f8fafc 60%);
        color: #0f172a;
        font-family: "Trebuchet MS", sans-serif;
      }
      .card {
        width: min(420px, calc(100% - 2rem));
        border-radius: 20px;
        background: #ffffff;
        padding: 2rem;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        color: #475569;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You are offline</h1>
      <p>DjerbaStay is not reachable right now. Please check your connection and try again.</p>
    </div>
  </body>
</html>
